name: Assinador PJe (Android)

on:
  push:
    branches: [main]
    paths:
      - "pjeoffice-android/**"
      - ".github/workflows/assinador-pje-android.yml"
  pull_request:
    paths:
      - "pjeoffice-android/**"
      - ".github/workflows/assinador-pje-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pjeoffice-android
    env:
      # Opcional: keystore próprio (base64) para que as atualizações instalem por cima.
      KEYSTORE_B64: ${{ secrets.ASSINADOR_KEYSTORE_BASE64 }}
      ASSINADOR_KEYSTORE_SENHA: ${{ secrets.ASSINADOR_KEYSTORE_SENHA }}
      ASSINADOR_CHAVE_ALIAS: ${{ secrets.ASSINADOR_CHAVE_ALIAS }}
      ASSINADOR_CHAVE_SENHA: ${{ secrets.ASSINADOR_CHAVE_SENHA }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar keystore de release
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/assinador.jks"
          echo "ASSINADOR_KEYSTORE=$RUNNER_TEMP/assinador.jks" >> "$GITHUB_ENV"

      - name: Testes do núcleo e APK
        run: ./gradlew --no-daemon :core:test :app:assembleRelease

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk "assinador-pje-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: assinador-pje-apk
          path: pjeoffice-android/assinador-pje-${{ github.run_number }}.apk

  publicar:
    # Publica o APK em "Releases" para baixar direto no celular.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: assinador-pje-apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: assinador-pje-v0.1.${{ github.run_number }}
          name: Assinador PJe para Android 0.1.${{ github.run_number }}
          prerelease: true
          body: |
            APK de teste do Assinador PJe para Android (pasta `pjeoffice-android/`).
            Baixe o arquivo `.apk` abaixo no celular e permita a instalação de apps desta fonte.
          files: assinador-pje-${{ github.run_number }}.apk
